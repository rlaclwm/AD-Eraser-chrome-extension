<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; padding: 15px; font-family: sans-serif; background: #fff; line-height: 1.4; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 2px solid #f8f9fa; padding-bottom: 8px; }
    h3 { font-size: 18px; margin: 0; color: #e74c3c; }
    #langSelect { font-size: 11px; padding: 2px; cursor: pointer; border-radius: 4px; border: 1px solid #ddd; }
    
    .btn-main { width: 100%; cursor: pointer; padding: 12px; background: #2d3436; color: white; border: none; border-radius: 6px; font-weight: bold; margin-bottom: 8px; transition: 0.2s; }
    .btn-main:hover { background: #000; }
    
    .btn-restore-all { width: 100%; cursor: pointer; padding: 10px; background: #00b894; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 11px; margin-bottom: 15px; transition: 0.2s; }
    .btn-restore-all:hover { background: #55efc4; }

    .option-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #636e72; margin-bottom: 8px; cursor: pointer; }
    
    .history-section { margin-top: 15px; border-top: 1px dashed #dfe6e9; padding-top: 10px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .history-title { font-weight: bold; font-size: 12px; color: #2d3436; }
    
    /* 새롭게 추가/정렬된 버튼들 */
    .btn-group { display: flex; gap: 4px; }
    .btn-small { font-size: 10px; padding: 4px 6px; cursor: pointer; color: white; border: none; border-radius: 4px; transition: 0.2s; }
    #toggleAllHistory { background-color: #0984e3; display: none; }
    #toggleAllHistory:hover { background-color: #74b9ff; }
    #restoreSelected { background-color: #6c5ce7; display: none; }
    #restoreSelected:hover { background-color: #a29bfe; }

    /* 히스토리 리스트 (전체보기를 누르면 스크롤 영역 안에서 길게 보여줍니다) */
    #historyList { max-height: 180px; overflow-y: auto; background: #fdfdfd; border: 1px solid #eee; border-radius: 4px; font-size: 11px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 6px; border-bottom: 1px solid #f1f2f6; }
    .restore-btn { padding: 2px 6px; background: #b2bec3; color: white; border: none; border-radius: 3px; font-size: 10px; cursor: pointer; }
    .restore-btn:hover { background: #e74c3c; }
  </style>
</head>
<body>
  <div class="header-row">
    <h3 data-i18n="appName">AD Eraser</h3>
    <select id="langSelect">
      <option value="ko">한국어</option>
      <option value="en">English</option>
    </select>
  </div>
  
  <button id="startSelection" class="btn-main" data-i18n="eraserMode"></button>
  <button id="restorePopups" class="btn-restore-all" data-i18n="restorePopups"></button>
  
  <label class="option-row">
    <input type="checkbox" id="skipConfirm"> <span data-i18n="skipConfirm"></span>
  </label>
  <label class="option-row">
    <input type="checkbox" id="multiSelect"> <span data-i18n="multiSelect"></span>
  </label>

  <div class="history-section">
    <div class="history-header">
      <span class="history-title" data-i18n="historyTitle"></span>
      <div class="btn-group">
        <button id="toggleAllHistory" class="btn-small" data-i18n="showAll"></button>
        <button id="restoreSelected" class="btn-small" data-i18n="selectedRestore"></button>
      </div>
    </div>
    <div id="historyList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
